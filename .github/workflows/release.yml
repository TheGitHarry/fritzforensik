name: Release

# Ein Workflow für beide Werkzeuge. Welches gebaut wird, ergibt sich aus dem
# Tag-Präfix — die Werkzeuge werden dadurch unabhängig voneinander versioniert:
#   export-v0.3.2  → baut nur fritzexport
#   report-v0.1.1  → baut nur fritzreport
on:
  push:
    tags:
      - "export-v*"
      - "report-v*"
  workflow_dispatch:
    inputs:
      tool:
        description: "Welches Werkzeug bauen"
        type: choice
        options: [all, export, report]
        default: all

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      tool: ${{ steps.pick.outputs.tool }}
    steps:
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOOL="${{ inputs.tool }}"
          else
            case "$GITHUB_REF_NAME" in
              export-v*) TOOL=export ;;
              report-v*) TOOL=report ;;
              *) echo "::error::Unerwarteter Tag '$GITHUB_REF_NAME' — erwartet export-v* oder report-v*"; exit 1 ;;
            esac
          fi
          echo "Baue: $TOOL"
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"

  build-export:
    needs: setup
    if: contains(fromJSON('["export","all"]'), needs.setup.outputs.tool)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            tag: linux-aarch64
          - os: windows-2022
            tag: windows-x86_64
          # macOS-Runner kosten das 10-fache an Actions-Minuten (nur Apple Silicon).
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6" "certifi" "requests>=2.31" pytest
      - name: Run unit tests
        run: python -m pytest
      - name: Build binary
        run: python scripts/build.py --tool export
      - uses: actions/upload-artifact@v4
        with:
          name: fritzexport-${{ matrix.tag }}
          path: dist/fritzexport-*
          if-no-files-found: error

  build-export-arm32:
    needs: setup
    if: contains(fromJSON('["export","all"]'), needs.setup.outputs.tool)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: uraimo/run-on-arch-action@v2
        name: Build on armv7 (QEMU)
        with:
          arch: armv7
          distro: ubuntu22.04
          githubToken: ${{ github.token }}
          install: |
            apt-get update -q -y
            apt-get install -y python3-pip python3-dev binutils
            pip3 install "pyinstaller>=6" certifi "requests>=2.31" pytest
          run: |
            python3 -m pytest
            python3 scripts/build.py --tool export
      - uses: actions/upload-artifact@v4
        with:
          name: fritzexport-linux-armv7l
          path: dist/fritzexport-*-linux-armv7l
          if-no-files-found: error

  build-report:
    needs: setup
    if: contains(fromJSON('["report","all"]'), needs.setup.outputs.tool)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            tag: linux-aarch64
          - os: windows-2022
            tag: windows-x86_64
          # macOS-Runner kosten das 10-fache an Actions-Minuten (nur Apple Silicon).
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # requests wird nur für die Export-Tests der gemeinsamen Suite gebraucht,
      # nicht für das Report-Binary — fritzreport importiert es nicht, PyInstaller
      # bündelt deshalb auch nichts davon ein.
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6" "requests>=2.31" pytest
      - name: Run unit tests
        run: python -m pytest
      - name: Build binary
        run: python scripts/build.py --tool report
      - uses: actions/upload-artifact@v4
        with:
          name: fritzreport-${{ matrix.tag }}
          path: dist/fritzreport-*
          if-no-files-found: error

  # Bei einem Tag-Push die gebauten Binaries als GitHub-Release veröffentlichen
  # (inkl. SHA256SUMS). Läuft NICHT bei workflow_dispatch — dort gibt es keinen
  # Tag, dann bleiben die Artefakte wie gehabt nur am Actions-Run hängen.
  release:
    needs: [build-export, build-export-arm32, build-report]
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Ohne name: werden ALLE Artefakte des Runs gezogen. Da bei einem
      # export-v* / report-v* Tag nur die Jobs des jeweiligen Werkzeugs laufen,
      # enthält das automatisch nur dessen Binaries.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Binaries sammeln und SHA256SUMS bilden
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && sha256sum fritz* > SHA256SUMS && cat SHA256SUMS )
          echo "--- Release-Inhalt ---"; ls -l release/
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*
