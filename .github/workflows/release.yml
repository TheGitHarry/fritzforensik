name: Release

# Ein Workflow für beide Werkzeuge. Welches gebaut wird, ergibt sich aus dem
# Tag-Präfix — die Werkzeuge werden dadurch unabhängig voneinander versioniert:
#   export-v0.3.2  → baut nur fritzexport
#   report-v0.1.1  → baut nur fritzreport
on:
  push:
    tags:
      - "export-v*"
      - "report-v*"
  workflow_dispatch:
    inputs:
      tool:
        description: "Welches Werkzeug bauen"
        type: choice
        options: [all, export, report]
        default: all

# Grundrecht für alle Jobs: nur lesen. In den Build-Jobs läuft `npm ci`, das die
# Install-Skripte der gesamten transitiven Abhängigkeitskette ausführt — jsdom ist
# reines Testwerkzeug und geht in kein Binary ein, ein kompromittiertes Paket darin
# soll aber unter keinen Umständen ins Repository schreiben können. Der release-Job
# hebt sich sein `contents: write` selbst.
permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-22.04
    outputs:
      tool: ${{ steps.pick.outputs.tool }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TOOL="${{ inputs.tool }}"
          else
            case "$GITHUB_REF_NAME" in
              export-v*) TOOL=export ;;
              report-v*) TOOL=report ;;
              *) echo "::error::Unerwarteter Tag '$GITHUB_REF_NAME' — erwartet export-v* oder report-v*"; exit 1 ;;
            esac
          fi
          echo "Baue: $TOOL"
          echo "tool=$TOOL" >> "$GITHUB_OUTPUT"
      # Der Release-Name kommt aus dem Tag, die Version im Binary-Dateinamen aber
      # aus __init__.py (scripts/build.py). Ohne diesen Abgleich entstünde bei
      # vergessenem Hochzählen ein Release "export-v0.4.1", das ein Binary
      # "fritzexport-0.4.0-…" enthält — grüner Build, falsches Artefakt.
      # Nur bei Tag-Läufen prüfbar; workflow_dispatch hat keine Version zu vergleichen.
      - name: Tag und Paketversion abgleichen
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          case "${{ steps.pick.outputs.tool }}" in
            export) PKG=fritzexport ;;
            report) PKG=fritzreport ;;
            *) echo "::error::Tag-Lauf ohne eindeutiges Werkzeug"; exit 1 ;;
          esac
          TAG_VERSION="${GITHUB_REF_NAME#*-v}"
          # sys.path explizit setzen statt aufs Arbeitsverzeichnis zu vertrauen —
          # dieselbe Quelle wie scripts/build.py, damit beide nie auseinanderlaufen.
          PKG_VERSION="$(python3 -c "import sys; sys.path.insert(0, '$GITHUB_WORKSPACE'); import $PKG; print($PKG.__version__)")"
          echo "Tag: $GITHUB_REF_NAME → $TAG_VERSION | $PKG/__init__.py: $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' erwartet Version $TAG_VERSION, aber $PKG/__init__.py steht auf $PKG_VERSION. Entweder Version hochzählen und committen, oder Tag löschen und passend neu setzen. (Auch Suffixe wie -rc1 müssen in __version__ stehen.)"
            exit 1
          fi

  build-export:
    needs: setup
    if: contains(fromJSON('["export","all"]'), needs.setup.outputs.tool)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            tag: linux-aarch64
          - os: windows-2022
            tag: windows-x86_64
          # macOS-Runner kosten das 10-fache an Actions-Minuten (nur Apple Silicon).
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node nur fürs Testen: ohne jsdom skippt tests/report/test_filter.py still,
      # der Lauf wäre grün ohne geprüfte Filterlogik. Geht ins Binary nicht ein.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps (jsdom)
        run: npm ci
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6" "certifi" "requests>=2.31" pytest
      - name: Run unit tests
        run: python -m pytest
      - name: Build binary
        run: python scripts/build.py --tool export
      # Artefakte zählen gegen das Actions-Storage-Kontingent, Release-Assets nicht.
      # Beim Tag-Lauf sind sie reine Durchreiche an den release-Job und Minuten später
      # überflüssig → 1 Tag. Bei workflow_dispatch entsteht kein Release, dort sind sie
      # das einzige Ergebnis → 7 Tage. Der Default wären 90 Tage für beides.
      - uses: actions/upload-artifact@v4
        with:
          name: fritzexport-${{ matrix.tag }}
          path: dist/fritzexport-*
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 7 }}

  # armv7 (32-bit ARM) wird nicht mehr gebaut — der Job lief QEMU-emuliert und
  # kostete bei jedem Release unverhältnismäßig viel Zeit. Für 32-bit-ARM gibt es
  # daher kein Binary; 64-bit ARM (linux-aarch64) bleibt unverändert bestehen.

  build-report:
    needs: setup
    if: contains(fromJSON('["report","all"]'), needs.setup.outputs.tool)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            tag: linux-x86_64
          - os: ubuntu-22.04-arm
            tag: linux-aarch64
          - os: windows-2022
            tag: windows-x86_64
          # macOS-Runner kosten das 10-fache an Actions-Minuten (nur Apple Silicon).
          - os: macos-14
            tag: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Node nur fürs Testen: ohne jsdom skippt tests/report/test_filter.py still,
      # der Lauf wäre grün ohne geprüfte Filterlogik. Geht ins Binary nicht ein.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install test deps (jsdom)
        run: npm ci
      # requests wird nur für die Export-Tests der gemeinsamen Suite gebraucht,
      # nicht für das Report-Binary — fritzreport importiert es nicht, PyInstaller
      # bündelt deshalb auch nichts davon ein.
      - name: Install build deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pyinstaller>=6" "requests>=2.31" pytest
      - name: Run unit tests
        run: python -m pytest
      - name: Build binary
        run: python scripts/build.py --tool report
      - uses: actions/upload-artifact@v4
        with:
          name: fritzreport-${{ matrix.tag }}
          path: dist/fritzreport-*
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/') && 1 || 7 }}

  # Bei einem Tag-Push die gebauten Binaries als GitHub-Release veröffentlichen
  # (inkl. SHA256SUMS). Läuft NICHT bei workflow_dispatch — dort gibt es keinen
  # Tag, dann bleiben die Artefakte wie gehabt nur am Actions-Run hängen.
  release:
    needs: [build-export, build-report]
    if: >-
      always()
      && startsWith(github.ref, 'refs/tags/')
      && !contains(needs.*.result, 'failure')
      && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      # Ohne name: werden ALLE Artefakte des Runs gezogen. Da bei einem
      # export-v* / report-v* Tag nur die Jobs des jeweiligen Werkzeugs laufen,
      # enthält das automatisch nur dessen Binaries.
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Binaries sammeln und SHA256SUMS bilden
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ( cd release && sha256sum fritz* > SHA256SUMS && cat SHA256SUMS )
          echo "--- Release-Inhalt ---"; ls -l release/
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            release/*
