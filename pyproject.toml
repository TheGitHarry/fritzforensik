[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legacy_report"
version = "0.1.0"
description = "Forensischer HTML-Report-Generator für legacy_export-Exporte einer AVM FRITZ!Box"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []  # stdlib-only

[project.scripts]
legacy_report = "legacy_report.__main__:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6", "pytest>=7"]

[tool.setuptools]
packages = ["legacy_report"]
py-modules = []

[tool.pytest.ini_options]
addopts = "-q"
