[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzforensik"
# Platzhalter — dieses Repo hat bewusst KEINE eigene Version.
#
# Die beiden Werkzeuge werden unabhängig versioniert (fritzexport/__init__.py,
# fritzreport/__init__.py); diese Zahlen stehen in den Binary-Namen und in den
# Release-Tags (export-v* / report-v*), und die CI gleicht Tag gegen __version__
# ab. Eine dritte Zahl hier wäre für keines der beiden Werkzeuge richtig und
# würde still veralten.
#
# 0.0.0 statt einer plausiblen Zahl wie 0.1.0: ein erkennbarer Platzhalter wird
# nicht als Reifegrad missverstanden. Ganz weglassen geht nicht — setuptools
# verlangt das Feld (oder eine dynamic-Quelle, die es hier nicht gibt).
# Wirkt ausschließlich bei `pip install .`; ausgeliefert werden Binaries.
version = "0.0.0"
description = "Forensik-Werkzeuge für AVM FRITZ!Box: Live-Datenabzug (fritzexport) und HTML-Report (fritzreport)"
readme = "README.md"
requires-python = ">=3.10"
# requests und defusedxml braucht ausschließlich fritzexport (defusedxml für XML aus
# Box-Antworten, #57). fritzreport und fritzformat sind stdlib-only; ein Test wacht
# darüber (tests/format/test_stdlib_only.py).
dependencies = ["requests>=2.31", "defusedxml>=0.7.1"]

[project.scripts]
fritzexport = "fritzexport.__main__:main"
fritzreport = "fritzreport.__main__:main"

[project.optional-dependencies]
# lint trägt die einzige Versionsangabe für ruff und mypy; CI installiert genau
# dieses Extra, dev zieht es mit. Anheben ist ein eigener Commit.
lint = ["ruff==0.17.6", "mypy==2.4.1"]
dev = ["pyinstaller>=6", "pytest>=7", "certifi", "fritzforensik[lint]"]

[tool.setuptools]
packages = ["fritzformat", "fritzexport", "fritzexport.extractors", "fritzreport"]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: Tests, die echte LAN-Verbindung benötigen (default deselected)",
    "golden: Tests gegen die echten Bundles unter ~/testdata (default deselected)",
]
# -ra listet am Ende jeden Skip mit Grund: test_filter.py skippt sonst still, wenn
# node/jsdom fehlen. --strict-markers lässt einen vertippten Marker scheitern, statt
# ihn wirkungslos durchzulassen; --strict-config tut dasselbe für die Konfiguration.
addopts = "-q -ra --strict-markers --strict-config -m 'not network and not golden'"
# Jede Warnung ist ein Fehler. Ein offener Socket oder eine veraltete API fällt
# so beim nächsten Lauf auf, statt in einer Zusammenfassung unterzugehen, die
# niemand liest. Ausnahmen gezielt eintragen, mit Begründung.
filterwarnings = ["error"]

[tool.ruff.lint]
# Regelauswahl ausdrücklich: Ohne select bestimmt die ruff-Version, was geprüft
# wird, und das wechselt mit jedem Update. Die Version steht im Extra lint.
# F = pyflakes (Ungenutztes, Tippfehler), B = bugbear (fehleranfällige Muster),
# I = Importreihenfolge, S = Sicherheit (bandit), UP = veraltete Schreibweisen,
# SIM = vereinfachbare Konstrukte, RUF = ruff-eigene Regeln. Zeilenlänge (E501) und
# ruff format bewusst nicht: Beides schriebe fast jede Datei um.
select = ["F", "B", "I", "S", "UP", "SIM", "RUF"]
ignore = [
    # Gedankenstrich und echtes Minuszeichen sind Typografie, keine Verwechslung;
    # der Report zeigt Versätze bewusst mit "−".
    "RUF001", "RUF002", "RUF003",
    # __all__ ist nach Herkunftsmodul gegliedert, nicht alphabetisch.
    "RUF022",
    # "Jan Feb … Dec".split() liest sich besser als die ausgeschriebene Liste.
    "SIM905",
]

[tool.ruff.lint.per-file-ignores]
# S trifft in den Tests fast nur assert (S101) und Fixture-Kram wie feste Passwörter
# und subprocess; dort ist das gewollt. Im Produktivcode ist jede Ausnahme einzeln
# per noqa begründet.
"tests/**" = ["S"]

[tool.mypy]
# Vorerst nur der Formatvertrag: klein, von beiden Werkzeugen genutzt, und dort
# kostet ein falscher Typ am meisten. Die Werkzeuge folgen paketweise, wenn sie
# unter --strict sauber sind; ein Lauf über alles meldete zu viele Fehlalarme.
files = ["fritzformat"]
strict = true
python_version = "3.10"
