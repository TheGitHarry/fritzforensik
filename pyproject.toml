[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fritzforensik"
# Platzhalter — dieses Repo hat bewusst KEINE eigene Version.
#
# Die beiden Werkzeuge werden unabhängig versioniert (fritzexport/__init__.py,
# fritzreport/__init__.py); diese Zahlen stehen in den Binary-Namen und in den
# Release-Tags (export-v* / report-v*), und die CI gleicht Tag gegen __version__
# ab. Eine dritte Zahl hier wäre für keines der beiden Werkzeuge richtig und
# würde still veralten.
#
# 0.0.0 statt einer plausiblen Zahl wie 0.1.0: ein erkennbarer Platzhalter wird
# nicht als Reifegrad missverstanden. Ganz weglassen geht nicht — setuptools
# verlangt das Feld (oder eine dynamic-Quelle, die es hier nicht gibt).
# Wirkt ausschließlich bei `pip install .`; ausgeliefert werden Binaries.
version = "0.0.0"
description = "Forensik-Werkzeuge für AVM FRITZ!Box: Live-Datenabzug (fritzexport) und HTML-Report (fritzreport)"
readme = "README.md"
requires-python = ">=3.10"
# requests wird ausschließlich von fritzexport benötigt. fritzreport und
# fritzformat sind stdlib-only; ein Test wacht darüber (tests/format/test_stdlib_only.py).
dependencies = ["requests>=2.31"]

[project.scripts]
fritzexport = "fritzexport.__main__:main"
fritzreport = "fritzreport.__main__:main"

[project.optional-dependencies]
dev = ["pyinstaller>=6", "pytest>=7", "certifi"]

[tool.setuptools]
packages = ["fritzformat", "fritzexport", "fritzexport.extractors", "fritzreport"]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: Tests, die echte LAN-Verbindung benötigen (default deselected)",
    "golden: Tests gegen die echten Bundles unter ~/testdata (default deselected)",
]
addopts = "-q -m 'not network and not golden'"
